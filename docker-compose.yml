# Start DHARANI 360 with:   docker compose up -d
# Stop it with:             docker compose down
# Records survive both - they live in the named volume below.

services:
  dharani360:
    build: .
    container_name: dharani360
    restart: unless-stopped
    ports:
      # Only listens on this machine. Cloudflare Tunnel (see DEPLOY.md)
      # is what publishes it, so no port is ever open to the internet.
      - "127.0.0.1:5000:5000"
    environment:
      # Signs session cookies. Generate one and put it in a .env file:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:-}
      # Leave empty to use the SQLite file in the volume.
      # Set to a Supabase connection string to share one database.
      DATABASE_URL: ${DATABASE_URL:-}
      # More than one worker is only safe once DATABASE_URL points at
      # Postgres. On SQLite, leave this at 1.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      # Secure session cookies. Leave on whenever the site is reached over
      # HTTPS, which is the case behind Cloudflare Tunnel.
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
    volumes:
      - dharani-data:/app/instance
      # The live Supabase keys for this installation, if you use them.
      # Read-only, and never baked into the image.
      - ./supabase_config.json:/app/supabase_config.json:ro

  # Uncomment this block, and set
  #   DATABASE_URL=postgresql://dharani:CHANGE-ME@postgres:5432/dharani360
  # in your .env, to run a real database alongside the app.
  #
  # postgres:
  #   image: postgres:16
  #   container_name: dharani360-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: dharani360
  #     POSTGRES_USER: dharani
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - dharani-db:/var/lib/postgresql/data

volumes:
  dharani-data:
  # dharani-db:
