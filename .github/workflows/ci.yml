# DHARANI 360 - automatic checks
#
# Runs on every push and every pull request. The same 44 checks that
# smoketest.py runs locally, but against BOTH databases, so a change that
# works on SQLite and breaks on PostgreSQL is caught here rather than by a
# customer.
#
# A failing run means: do not deploy this commit.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  sqlite:
    name: 44 checks on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configuration is readable
        run: python config.py
      - name: Smoke test
        run: python smoketest.py

  postgres:
    name: 44 checks on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dharani360
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke test
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/dharani360
        run: python smoketest.py

  backup:
    name: Backup can be created and verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed, back up, and prove the backup restores
        run: |
          python demo_data.py
          python backup.py create
          python backup.py verify "$(ls -t backups/*.zip | head -1)"
