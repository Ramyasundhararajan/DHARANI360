# DHARANI 360 - automatic checks
#
# Runs on every push and every pull request. The same checks that
# smoketest.py runs locally, on the sample SQLite database.
#
# PostgreSQL job is switched off until the live database is set up.
# To restore it, bring back the "postgres" job from git history
# (commit 968841f, .github/workflows/ci.yml).
#
# A failing run means: do not deploy this commit.

name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  sqlite:
    name: Checks on SQLite (sample data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Report only: CI has no .env, so settings such as COPY_TO are always
      # "missing" here. Must not fail the build.
      - name: Configuration is readable
        run: python config.py || true
      - name: Smoke test
        run: python smoketest.py

  backup:
    name: Backup can be created and verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seed, back up, and prove the backup restores
        run: |
          python demo_data.py
          python backup.py create
          python backup.py verify "$(ls -t backups/*.zip | head -1)"
